# Generated from conda-recipe/meta.yaml.
# Allows vol2mesh to be used as a pixi source dependency, e.g.
#
#   [dependencies]
#   vol2mesh = { path = "/path/to/vol2mesh" }
#
# Keep the dependency lists below in sync with conda-recipe/meta.yaml.

[workspace]
name = "vol2mesh"
channels = ["conda-forge", "flyem-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[package]
name = "vol2mesh"
version = "0.3"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
noarch = true
# The default installer (uv) crashes on rattler-build's placeholder prefix; pip works.
installer = "pip"

[package.host-dependencies]
python = ">=3.6"
setuptools = "*"
pip = "*"

[package.run-dependencies]
python = ">=3.6"
numpy = ">=1.22.4"
pandas = "*"
scipy = "*"
lz4 = ">=2"
scikit-image = ">=0.13"
numba = "*"
marching_cubes = ">=0.2"
pyfqmr = "*"
dracopy = "*"
trimesh = "*"

# Optional dependencies (see conda-recipe/meta.yaml for notes)
# openmesh-python = "*"

# Development environment for working on vol2mesh itself.
[dependencies]
vol2mesh = { path = "." }

[feature.test.dependencies]
pytest = "*"
trimesh = "*"

[feature.test.tasks]
test = "pytest -s --tb=native --pyargs vol2mesh.tests"

[environments]
test = ["test"]
