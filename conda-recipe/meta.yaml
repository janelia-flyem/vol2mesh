#
# Automatically determine the version from the last git tag.
#
{% if GIT_DESCRIBE_NUMBER|int == 0 %}
  {% set version = GIT_DESCRIBE_TAG %}
{% else %}
  # If we're using a non-tagged revision, append '.postN' to the version
  {% set version = GIT_DESCRIBE_TAG + '.post' + GIT_DESCRIBE_NUMBER %}
{% endif %}

package:
  name: vol2mesh
  version: "{{ version }}"

source:
  path: ..

build:
  number: 0
  string: "{{ PKG_BUILDNUM }}_py{{ CONDA_PY }}_g{{ GIT_FULL_HASH[:7] }}"
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-build-isolation --no-index -vv

requirements:
  host:
    - python >=3.6
    - pip
    - setuptools
  run:
    - python >=3.6
    - numpy >=1.22.4
    - pandas
    - scipy
    - lz4 >=2
    - scikit-image >=0.13
    - numba
    - marching_cubes >=0.2
    - pyfqmr

    # As of 2026-05, openmesh-python isn't available for osx-arm64.
    # It's an optional dependency (late import) in vol2mesh anyway.
    #- openmesh-python

    # To support windows builds, I'm removing this dependency.  Users will have to install it themselves.
    # If I keep it in, I can't make this package noarch, and I'd have to build on windows explicitly.
    # One option would be to add a 'base' package that adds this dependency back.
    # (Another option is to actually build on Windows.)
    # - dvidutils >=0.0.post81  # [not win]

test:
  imports:
    - vol2mesh
  requires:
    - pytest
  commands:
    - pytest -s --tb=native --pyargs vol2mesh.tests

about:
  home: https://github.com/janelia-flyem/vol2mesh
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Tools for converting image volumes to meshes
